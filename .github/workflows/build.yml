name: Build

on:
    # push:
    # branches: [ "**" ]
    pull_request:
        branches: ["**"]
    # Called by other workflows (e.g. release.yml) with an optional artifact upload flag
    workflow_call:
        inputs:
            build_neoforge:
                description: "Build JARs for Neoforge?"
                type: boolean
                required: true
                default: true
            build_fabric:
                description: "Build JARs for Fabric?"
                type: boolean
                required: true
                default: true
            upload_artifact:
                description: "Upload build artifacts"
                type: boolean
                required: false
                default: false
    # Called manually from the UI
    workflow_dispatch:
        inputs:
            build_neoforge:
                description: "Build JARs for Neoforge?"
                type: boolean
                required: true
                default: true
            build_fabric:
                description: "Build JARs for Fabric?"
                type: boolean
                required: true
                default: true
            upload_artifact:
                description: "Upload build artifacts"
                type: boolean
                required: false
                default: false

jobs:
    build:
        name: Build mod jars
        runs-on: ubuntu-latest

        env:
            CI: "true"
            STORE_PATH: ""
            PNPM_VERSION: 10
            RETENTION_DAYS_PUSH: 2
            RETENTION_DAYS_OTHER: 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Java 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Setup Node.js v${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}
                  run_install: false

            - name: Get pnpm store directory
              shell: bash
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@v5
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - name: Install Node.js dependencies
              run: pnpm install

            - name: Get Version Info
              if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
              id: get_info
              run: |
                  MOD_ID=$(pnpm --silent extract-prop gradle.properties mod_id)
                  echo "MOD_ID=$MOD_ID" >> $GITHUB_OUTPUT
                  MOD_VERSION=$(pnpm --silent extract-prop gradle.properties version)
                  echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_OUTPUT
                  MC_VERSION=$(pnpm --silent extract-prop gradle.properties mc_version)
                  echo "MC_VERSION=$MC_VERSION" >> $GITHUB_OUTPUT

            - name: "[Neoforge] Run DataGen"
              if: ${{ inputs.build_neoforge == true }}
              run: ./gradlew :neoforge:runData

            - name: "[Neoforge] Build JARs"
              if: ${{ inputs.build_neoforge == true }}
              run: ./gradlew :neoforge:build

            - name: "[Fabric] Run DataGen"
              if: ${{ inputs.build_fabric == true }}
              run: ./gradlew :fabric:runData

            - name: "[Fabric] Build JARs"
              if: ${{ inputs.build_fabric == true }}
              run: ./gradlew :fabric:build

            - name: Delete extra files
              run: |
                  rm fabric/build/libs/*-javadoc.jar
                  rm fabric/build/libs/*-sources.jar
                  rm neoforge/build/libs/*-javadoc.jar
                  rm neoforge/build/libs/*-sources.jar

            - name: Upload build artifacts
              if: ${{ inputs.upload_artifact == true }}
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ steps.get_info.outputs.MOD_ID }}-${{ steps.get_info.outputs.MC_VERSION }}-${{ steps.get_info.outputs.MOD_VERSION }}-${{ github.sha }}
                  path: |
                      fabric/build/libs/*.jar
                      neoforge/build/libs/*.jar
                  if-no-files-found: error
                  retention-days: ${{ github.event_name == 'push' && env.RETENTION_DAYS_PUSH || env.RETENTION_DAYS_OTHER }}
