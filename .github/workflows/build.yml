name: Build

on:
    # push:
    # branches: [ "**" ]
    pull_request:
        branches: ["**"]
    # Called by other workflows (e.g. release.yml) with an optional artifact upload flag
    workflow_call:
        inputs:
            upload_artifact:
                description: "Upload build artifacts"
                type: boolean
                required: false
                default: false
    # Called manually from the UI
    workflow_dispatch:
        inputs:
            upload_artifact:
                description: "Upload build artifacts"
                type: boolean
                required: false
                default: false

jobs:
    build:
        name: Build mod jars
        runs-on: ubuntu-latest

        env:
            RETENTION_DAYS_PUSH: 2
            RETENTION_DAYS_OTHER: 5

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Java 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v3

            - name: Build with Gradle
              run: ./gradlew build

            - name: Delete extra files
              run: |
                  rm fabric/build/libs/*-javadoc.jar
                  rm fabric/build/libs/*-sources.jar
                  rm neoforge/build/libs/*-javadoc.jar
                  rm neoforge/build/libs/*-sources.jar

            - name: Upload build artifacts
              if: ${{ inputs.upload_artifact == true }}
              uses: actions/upload-artifact@v7
              with:
                  name: Symbols-n-Signs-${{ github.ref_name }}-${{ github.sha }}
                  path: |
                      fabric/build/libs/*.jar
                      neoforge/build/libs/*.jar
                  if-no-files-found: error
                  retention-days: ${{ github.event_name == 'push' && env.RETENTION_DAYS_PUSH || env.RETENTION_DAYS_OTHER }}
