# Important Notes:
# Version-specific properties (minecraft_version, fabric_version, neoforge_version, etc.)
# are loaded from versions/<mc_version>.properties automatically.
# To target a different MC version: set mc_version below and create versions/<ver>.properties.
# Git convention: one branch per game version (e.g. 1.21.1, 1.21.4) branching from `develop`.

# Project
version=1.0.0-beta.1
group=com.drunkencod.symbols_n_signs
java_version=21

# Active Minecraft version (must match a file in versions/)
mc_version=1.21.1

# Common mod metadata
mod_name=Symbols'n'Signs
mod_author=Sv443
mod_organization=Drunken Cod
mod_id=symbols_n_signs
license=AGPL-3.0-or-later
description=Symbol items and road signs for Minecraft. They are cheaply made and used for decoration, labeling, or to give more meaning to Create's Redstone Links.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
